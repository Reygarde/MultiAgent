[package]
name = "aiplatform-studio"
version = "0.6.5"
description = "Local AIPlatform Studio desktop shell"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ureq = { version = "2.12", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = "thin"
